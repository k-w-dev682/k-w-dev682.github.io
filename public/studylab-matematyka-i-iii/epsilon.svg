<text x="24" y="143" font-family="Arial" font-size="21" fill="#adf1e0">g + ε</text>
<text x="49" y="194" font-family="Arial" font-size="21" fill="#adf1e0">g</text>
<text x="24" y="243" font-family="Arial" font-size="21" fill="#adf1e0">g − ε</text>
<text x="330" y="343" font-family="Arial" font-size="19" fill="#c8eee2">Po numerze N wszystkie kolejne wyrazy mieszczą się w pasie.</text>
