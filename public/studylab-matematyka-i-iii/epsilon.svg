<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="Pas wokół granicy g o szerokości epsilon: dalsze wyrazy ciągu mieszczą się w pasie">
<rect width="900" height="370" rx="20" fill="#091414"/>
