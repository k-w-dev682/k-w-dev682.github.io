<g fill="#f2d479" stroke="#fff1c1" stroke-width="2"><circle cx="145" cy="90" r="7"/><circle cx="214" cy="260" r="7"/></g>
<g fill="#58e8c8"><circle cx="313" cy="150" r="7"/><circle cx="381" cy="225" r="7"/><circle cx="453" cy="165" r="7"/><circle cx="525" cy="202" r="7"/><circle cx="597" cy="182" r="7"/><circle cx="669" cy="191" r="7"/><circle cx="741" cy="184" r="7"/></g>
