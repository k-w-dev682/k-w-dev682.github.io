<rect x="85" y="138" width="738" height="100" rx="6" fill="#185345" opacity=".55"/>
<line x1="85" y1="188" x2="830" y2="188" stroke="#7bf1d1" stroke-width="2"/>
<line x1="85" y1="138" x2="830" y2="138" stroke="#85c7b5" stroke-dasharray="7 6"/>
