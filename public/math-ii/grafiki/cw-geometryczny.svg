<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="tt dd"><title id="tt">Dlaczego wzór na sumę geometryczną w ogóle działa?</title><desc id="dd">S−qS = 1−qⁿ, gdy q ≠ 1.</desc><rect x="2" y="2" width="956" height="381" rx="23" fill="#06090e" stroke="#28414e" stroke-width="1.5" /><path d="M20 90L939 90" fill="none" stroke="#28414e" stroke-width="1.5" /><text x="32" y="33" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA II</text><text x="32" y="71" fill="#eff8fa" font-size="24" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Dlaczego wzór na sumę geometryczną w ogóle działa?</text><rect x="38" y="106" width="592" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="80" y="143" fill="#5ce2d1" font-size="21" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S   = 1 + q + q² + q³</text><text x="80" y="190" fill="#8db9ff" font-size="21" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">qS =      q + q² + q³ + q⁴</text><path d="M72 210L570 210" fill="none" stroke="#28414e" stroke-width="1.8" /><text x="80" y="256" fill="#f5c178" font-size="23" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S − qS = 1 − q⁴</text><text x="80" y="297" fill="#adc3d0" font-size="16" font-weight="570" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Środek znika po odjęciu.</text><rect x="649" y="106" width="280" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="674" y="143" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">ZAPAMIĘTAJ</text><text x="674" y="182" fill="#f5c178" font-size="18" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Zostają brzegi</text><text x="674" y="219" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S−qS = 1−qⁿ, gdy q ≠ 1.</text><text x="669" y="336" fill="#adc3d0" font-size="11" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">OBSERWUJ → POLICZ → WYJAŚNIJ</text></svg>