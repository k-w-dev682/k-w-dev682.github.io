<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="tt dd"><title id="tt">Skąd bierze się reguła Pascala w dowodzie?</title><desc id="dd">Dwie drogi do tego samego składnika.</desc><rect x="2" y="2" width="956" height="381" rx="23" fill="#06090e" stroke="#28414e" stroke-width="1.5" /><path d="M20 90L939 90" fill="none" stroke="#28414e" stroke-width="1.5" /><text x="32" y="33" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA II</text><text x="32" y="71" fill="#eff8fa" font-size="24" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Skąd bierze się reguła Pascala w dowodzie?</text><rect x="38" y="106" width="592" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="72" y="141" fill="#5ce2d1" font-size="23" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">a² + 2ab + b²</text><path d="M270 158L270 185" fill="none" stroke="#f5c178" stroke-width="2.2" /><path d="M260 179L270 185L260 191" fill="none" stroke="#f5c178" stroke-width="2"/><text x="72" y="223" fill="#8db9ff" font-size="18" font-weight="710" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">× a  →  a³ + 2a²b + ab²</text><text x="72" y="268" fill="#f5c178" font-size="18" font-weight="710" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">× b  →  a²b + 2ab² + b³</text><text x="73" y="313" fill="#eff8fa" font-size="17" font-weight="740" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Połącz te same wyrazy: 1, 3, 3, 1</text><rect x="649" y="106" width="280" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="674" y="143" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">ZAPAMIĘTAJ</text><text x="674" y="182" fill="#f5c178" font-size="18" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Reguła Pascala</text><text x="674" y="219" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Dwie drogi do tego samego</text><text x="674" y="243" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">składnika.</text><text x="669" y="336" fill="#adc3d0" font-size="11" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">OBSERWUJ → POLICZ → WYJAŚNIJ</text></svg>