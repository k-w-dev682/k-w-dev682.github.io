<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="tt dd"><title id="tt">Suma `1+2+...+n` — od parowania do dowodu</title><desc id="dd">Pierwszy+ostatni = n+1.</desc><rect x="2" y="2" width="956" height="381" rx="23" fill="#06090e" stroke="#28414e" stroke-width="1.5" /><path d="M20 90L939 90" fill="none" stroke="#28414e" stroke-width="1.5" /><text x="32" y="33" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA II</text><text x="32" y="71" fill="#eff8fa" font-size="24" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Suma `1+2+...+n` — od parowania do dowodu</text><rect x="38" y="106" width="592" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="100" y="133" fill="#5ce2d1" font-size="19" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S = 1 + 2 + 3 + 4 + 5</text><text x="100" y="178" fill="#8db9ff" font-size="19" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S = 5 + 4 + 3 + 2 + 1</text><path d="M80 200L568 200" fill="none" stroke="#28414e" stroke-width="2" /><text x="100" y="242" fill="#f5c178" font-size="19" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">2S = 6 + 6 + 6 + 6 + 6</text><text x="100" y="285" fill="#eff8fa" font-size="17" font-weight="680" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">S = 5 × 6 ÷ 2 = 15</text><rect x="649" y="106" width="280" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="674" y="143" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">ZAPAMIĘTAJ</text><text x="674" y="182" fill="#f5c178" font-size="18" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Paruj skrajne</text><text x="674" y="219" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Pierwszy+ostatni = n+1.</text><text x="669" y="336" fill="#adc3d0" font-size="11" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">OBSERWUJ → POLICZ → WYJAŚNIJ</text></svg>