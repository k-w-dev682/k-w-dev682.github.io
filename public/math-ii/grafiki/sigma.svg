<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="tt dd"><title id="tt">Sigma to skrót: „podstaw kolejne indeksy i dodaj”</title><desc id="dd">Podstaw dolny, następne, także górny.</desc><rect x="2" y="2" width="956" height="381" rx="23" fill="#06090e" stroke="#28414e" stroke-width="1.5" /><path d="M20 90L939 90" fill="none" stroke="#28414e" stroke-width="1.5" /><text x="32" y="33" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA II</text><text x="32" y="71" fill="#eff8fa" font-size="24" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Sigma to skrót: „podstaw kolejne indeksy i dodaj”</text><rect x="38" y="106" width="592" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><rect x="60" y="145" width="155" height="83" rx="15" fill="#101e29" stroke="#28414e" stroke-width="1.5" /><text x="137.5" y="176" fill="#5ce2d1" font-size="17" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">k = 1</text><text x="137.5" y="204" fill="#eff8fa" font-size="15" font-weight="600" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">2k + 1 = 3</text><path d="M217 186L241 186" fill="none" stroke="#5ce2d1" stroke-width="2.2" /><path d="M231 180L241 186L231 192" fill="none" stroke="#5ce2d1" stroke-width="2"/><rect x="245" y="145" width="155" height="83" rx="15" fill="#101e29" stroke="#28414e" stroke-width="1.5" /><text x="322.5" y="176" fill="#5ce2d1" font-size="17" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">k = 2</text><text x="322.5" y="204" fill="#eff8fa" font-size="15" font-weight="600" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">2k + 1 = 5</text><path d="M402 186L426 186" fill="none" stroke="#5ce2d1" stroke-width="2.2" /><path d="M416 180L426 186L416 192" fill="none" stroke="#5ce2d1" stroke-width="2"/><rect x="430" y="145" width="155" height="83" rx="15" fill="#101e29" stroke="#28414e" stroke-width="1.5" /><text x="507.5" y="176" fill="#5ce2d1" font-size="17" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">k = 3</text><text x="507.5" y="204" fill="#eff8fa" font-size="15" font-weight="600" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">2k + 1 = 7</text><text x="65" y="273" fill="#adc3d0" font-size="15" font-weight="570" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Σ: podstaw indeks → policz składnik → dodaj wszystkie składniki.</text><rect x="649" y="106" width="280" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><text x="674" y="143" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">ZAPAMIĘTAJ</text><text x="674" y="182" fill="#f5c178" font-size="18" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Czytaj indeksy</text><text x="674" y="219" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Podstaw dolny, następne,</text><text x="674" y="243" fill="#eff8fa" font-size="15" font-weight="620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">także górny.</text><text x="669" y="336" fill="#adc3d0" font-size="11" font-weight="720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">OBSERWUJ → POLICZ → WYJAŚNIJ</text></svg>