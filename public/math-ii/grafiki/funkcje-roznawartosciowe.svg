<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="tt dd"><title id="tt">Funkcja może istnieć, ale nie dać się jednoznacznie odwrócić</title><desc id="dd">Dwa różne wejścia nie mogą dać tego samego.</desc><rect x="2" y="2" width="956" height="381" rx="23" fill="#06090e" stroke="#28414e" stroke-width="1.5" /><path d="M20 90L939 90" fill="none" stroke="#28414e" stroke-width="1.5" /><text x="32" y="33" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA II</text><text x="32" y="71" fill="#eff8fa" font-size="24" font-weight="790" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="start">Funkcja może istnieć, ale nie dać się jednoznacznie odwrócić</text><rect x="38" y="106" width="592" height="246" rx="17" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><rect x="68" y="111" width="528" height="186" rx="15" fill="#0c1520" stroke="#28414e" stroke-width="1.5" /><rect x="100" y="125" width="89" height="40" rx="15" fill="#101e29" stroke="#5ce2d1" stroke-width="1.5" /><text x="144" y="152" fill="#eff8fa" font-size="20" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">1</text><path d="M210 145L430 145" fill="none" stroke="#5ce2d1" stroke-width="2.2" /><path d="M420 139L430 145L420 151" fill="none" stroke="#5ce2d1" stroke-width="2"/><rect x="447" y="125" width="89" height="40" rx="15" fill="#101e29" stroke="#8db9ff" stroke-width="1.5" /><text x="491" y="152" fill="#eff8fa" font-size="20" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">1</text><rect x="100" y="176" width="89" height="40" rx="15" fill="#101e29" stroke="#5ce2d1" stroke-width="1.5" /><text x="144" y="203" fill="#eff8fa" font-size="20" font-weight="760" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">2</text><path d="M210 196L430 196" fill="none" st