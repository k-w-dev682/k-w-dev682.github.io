<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">IEEE 754 binary32: liczba 2.5</title><desc id="d">IEEE 754 binary32: liczba 2.5</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#61e4c5"/></marker></defs><rect width="600" height="430" rx="16" fill="#080e10"/><text x="300" y="38" text-anchor="middle" fill="#61e4c5" font-family="Arial, sans-serif" font-size="23">IEEE 754 binary32: liczba 2.5</text><rect x="30" y="85" width="90" height="90" rx="12" fill="#112421" stroke="#398e7b"/><text x="75.0" y="115" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">0</text><text x="75.0" y="142" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">1 bit</text><rect x="135" y="85" width="200" height="90" rx="12" fill="#112421" stroke="#398e7b"/><text x="235.0" y="115" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">10000000</text><text x="235.0" y="142" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">8 bitów wykładnika</text><rect x="350" y="85" width="220" height="90" rx="12" fill="#112421" stroke="#398e7b"/><text x="460.0" y="115" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">010…0</text><text x="460.0" y="142" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">23 bity ułamka</text><text x="75" y="215" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="17">S = 0</text><text x="235" y="215" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="17">E = 128</text><text x="460" y="215" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="17">f = 1/4</text><rect x="65" y="260" width="470" height="90" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="290" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">(+1) × (1 + 0.25) × 2¹ = 2.5</text><text x="300.0" y="317" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Rzeczywisty wykładnik: 128 − 127 = 1</text><text x="300" y="395" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="15">Ten wzór dotyczy znormalizowanych liczb skończonych.</text></svg>