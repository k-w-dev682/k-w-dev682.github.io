<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">Adres a zawartość pod adresem</title><desc id="d">Adres a zawartość pod adresem</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#61e4c5"/></marker></defs><rect width="600" height="430" rx="16" fill="#080e10"/><text x="300" y="38" text-anchor="middle" fill="#61e4c5" font-family="Arial, sans-serif" font-size="23">Adres a zawartość pod adresem</text><rect x="30" y="90" width="200" height="90" rx="12" fill="#112421" stroke="#398e7b"/><text x="130.0" y="120" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">p = adres x</text><text x="130.0" y="147" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Adres, nie kopia wartości</text><rect x="370" y="70" width="190" height="80" rx="12" fill="#112421" stroke="#398e7b"/><text x="465.0" y="100" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">x = 7</text><text x="465.0" y="127" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Po *p = 7</text><rect x="370" y="250" width="190" height="80" rx="12" fill="#112421" stroke="#398e7b"/><text x="465.0" y="280" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">y = 10</text><text x="465.0" y="307" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Po p = &amp;y; *p += 1</text><path d="M230 120 L370 110" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="300.0" y="108.0" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="14">najpierw</text><path d="M230 160 L370 285" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="300.0" y="215.5" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="14">potem</text><text x="300" y="380" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="16">Zmiana p wybiera obiekt; zmiana *p zapisuje do niego.</text></svg>