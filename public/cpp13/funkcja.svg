<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">Wywołanie ma własne dane</title><desc id="d">Wywołanie ma własne dane</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#61e4c5"/></marker></defs><rect width="600" height="430" rx="16" fill="#080e10"/><text x="300" y="38" text-anchor="middle" fill="#61e4c5" font-family="Arial, sans-serif" font-size="23">Wywołanie ma własne dane</text><rect x="30" y="90" width="235" height="100" rx="12" fill="#112421" stroke="#398e7b"/><text x="147.5" y="120" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">main: x = 3</text><text x="147.5" y="147" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">y czeka na wynik</text><rect x="335" y="90" width="235" height="100" rx="12" fill="#112421" stroke="#398e7b"/><text x="452.5" y="120" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">suma: a = 3, b = 4</text><text x="452.5" y="147" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Osobne kopie argumentów</text><path d="M265 120 L335 120" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="335" y="235" width="235" height="80" rx="12" fill="#112421" stroke="#398e7b"/><text x="452.5" y="265" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">wynik = 7</text><text x="452.5" y="292" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Lokalna wartość funkcji</text><path d="M450 190 L450 235" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="235" width="235" height="80" rx="12" fill="#112421" stroke="#398e7b"/><text x="147.5" y="265" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">main: y = 7</text><text x="147.5" y="292" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">x nadal równe 3</text><path d="M335 275 L265 275" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="300.0" y="268.0" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="14">return</text><text x="300" y="380" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="17">Po powrocie lokalne obiekty funkcji kończą życie.</text></svg>