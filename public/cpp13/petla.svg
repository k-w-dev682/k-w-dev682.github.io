<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">for: dokładna kolejność kroków</title><desc id="d">for: dokładna kolejność kroków</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#61e4c5"/></marker></defs><rect width="600" height="430" rx="16" fill="#080e10"/><text x="300" y="38" text-anchor="middle" fill="#61e4c5" font-family="Arial, sans-serif" font-size="23">for: dokładna kolejność kroków</text><rect x="170" y="70" width="260" height="60" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="100" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">i = 1, suma = 0</text><path d="M300 130 L300 165" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="170" y="165" width="260" height="60" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="195" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">Czy i ≤ 3?</text><path d="M300 225 L300 270" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="332.0" y="240.5" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="14">TAK</text><rect x="170" y="270" width="260" height="75" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="300" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">suma += i; ++i;</text><text x="300.0" y="327" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Dodaj, potem zwiększ licznik</text><path d="M170 308 H90 V195 H165" fill="none" stroke="#61e4c5" stroke-width="2" marker-end="url(#a)"/><text x="65" y="252" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="13">powrót</text><path d="M430 195 L510 195" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="470.0" y="188.0" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="14">NIE</text><rect x="460" y="235" width="120" height="60" rx="12" fill="#112421" stroke="#398e7b"/><text x="520.0" y="265" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">Koniec</text><path d="M510 195 L510 235" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="300" y="395" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="16">Warunek sprawdzamy także po ostatnim obiegu.</text></svg>