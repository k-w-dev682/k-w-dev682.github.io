<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">Program: dane → obliczenie → wynik</title><desc id="d">Odczyt zmiennych nie zmienia ich wartości. Wynik sumowania trafia do nowej zmiennej.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#61e4c5"/></marker></defs><rect width="600" height="430" rx="16" fill="#080e10"/><text x="300" y="38" text-anchor="middle" fill="#61e4c5" font-family="Arial, sans-serif" font-size="23">Program: dane → obliczenie → wynik</text><rect x="150" y="75" width="300" height="75" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="105" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">a = 2, b = 3</text><text x="300.0" y="132" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Dwa niezależne miejsca na liczby</text><path d="M300 150 L300 185" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="150" y="185" width="300" height="75" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="215" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">suma = a + b</text><text x="300.0" y="242" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Odczytaj 2 i 3; zapisz 5</text><path d="M300 260 L300 295" stroke="#61e4c5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="150" y="295" width="300" height="75" rx="12" fill="#112421" stroke="#398e7b"/><text x="300.0" y="325" text-anchor="middle" fill="#e8f8f3" font-family="Arial, sans-serif" font-size="18">cout &lt;&lt; suma</text><text x="300.0" y="352" text-anchor="middle" fill="#b5cdc7" font-family="Arial, sans-serif" font-size="14">Konsola pokazuje 5</text></svg>