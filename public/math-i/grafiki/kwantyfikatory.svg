<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 342" role="img" aria-labelledby="tt dd">
 <title id="tt">„Dla każdego” to nie „istnieje”</title><desc id="dd">∀ wymaga wszystkich, ∃ wymaga choć jednego</desc>
 <rect x="2" y="2" width="956" height="338" rx="23" fill="#06090e" stroke="#263c49" stroke-width="2"/>
 <path d="M20 82 H940" stroke="#263c49" stroke-width="1.2"/>
 <text x="28" y="33" fill="#5ce2d1" font-size="12" font-weight="800" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">STUDYLAB / MATEMATYKA I</text>
 <text x="28" y="65" fill="#eff8fa" font-size="25" font-weight="800" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">„Dla każdego” to nie „istnieje”</text>
 <rect x="30" y="98" width="558" height="192" rx="16" fill="#0d1620" stroke="#263c49" stroke-width="1.4" /><text x="115" y="131" fill="#5ce2d1" font-size="17" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">p</text><text x="220" y="131" fill="#5ce2d1" font-size="17" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">q</text><text x="328" y="131" fill="#5ce2d1" font-size="17" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">p ∧ q</text><text x="442" y="131" fill="#5ce2d1" font-size="17" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">p ⇒ q</text><text x="76" y="181" fill="#5ce2d1" font-size="18" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">∀ — każdy spełnia warunek</text><text x="76" y="213" fill="#f5c178" font-size="18" font-weight="700" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">∃ — wystarczy jeden przykład</text><text x="76" y="248" fill="#eff8fa" font-size="19" font-weight="600" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">¬∀ ↔ ∃¬     ¬∃ ↔ ∀¬</text><rect x="614" y="98" width="315" height="191" rx="16" fill="#0d1620" stroke="#263c49" stroke-width="1.4" /><text x="637" y="128" fill="#5ce2d1" font-size="13" font-weight="800" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">JAK O TYM MYŚLEĆ?</text><text x="637" y="158" fill="#eff8fa" font-size="18" font-weight="650" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">∀ wymaga wszystkich, ∃ wymaga</text><text x="637" y="183" fill="#eff8fa" font-size="18" font-weight="650" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">choć jednego</text><path d="M 637 252 L 903 252" stroke="#263c49" stroke-width="1" fill="none" /><text x="637" y="277" fill="#f5c178" font-size="12" font-weight="760" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">PATRZ → WYJAŚNIJ → SPRAWDŹ</text>
 <text x="30" y="326" fill="#9eb6c5" font-size="12" font-weight="650" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif" text-anchor="start">Jednym kontrprzykładem obalisz „dla każdego”</text>
