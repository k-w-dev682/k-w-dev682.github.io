<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">W najwyższym punkcie zeruje się tylko prędkość pionowa</title><desc id="d">**Szczyt: vᵧ=0. Tylko na tę samą wysokość: czas lotu = 2×czas wznoszenia.**</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">W najwyższym punkcie zeruje się tylko prędkość pionowa</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><path d="M86 301L550 301" fill="none" stroke="#a9bac6" stroke-width="2" stroke-linecap="round"/><path d="M86 301L86 130" fill="none" stroke="#a9bac6" stroke-width="2" stroke-linecap="round"/><path d="M94 299 Q326 66 540 299" fill="none" stroke="#5ce2d1" stroke-width="4" stroke-linecap="round"/><path d="M95 299L192 203" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M192 203L189.36179699153467 212.64571847433484" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M192 203L182.3274612592405 205.53810841149593" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M95 299L195 299" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M195 299L186.3397459621556 304.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M195 299L186.3397459621556 294.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><circle cx="324" cy="184" r="7" fill="#5ce2d1" stroke="#061019" stroke-width="2"/><text x="335" y="176" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" fill="#f5be76">vᵧ = 0 na szczycie</text><text x="124" y="334" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="680" fill="#e9f6fa">x →</text><text x="50" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="680" fill="#e9f6fa">y ↑</text><text x="205" y="299" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" fill="#f5be76">v₀ₓ</text><text x="117" y="205" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" fill="#8db9ff">v₀</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">v₀ᵧ = 15 m/s</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">g = 10 m/s²</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">szczyt po 1,5 s</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">h = 11,25 m</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>