<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">Pęd łączy masę z prędkością</title><desc id="d">**p=mv; kilogram razy metr na sekundę.**</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">Pęd łączy masę z prędkością</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><rect x="90" y="191" width="163" height="89" rx="17" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><rect x="390" y="191" width="163" height="89" rx="17" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="171" y="235" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#e9f6fa">CIAŁO 1</text><text x="471" y="235" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#e9f6fa">CIAŁO 2</text><path d="M170 180L305 180" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><path d="M305 180L296.33974596215563 185.0" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><path d="M305 180L296.33974596215563 175.0" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><path d="M471 180L403 180" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M403 180L411.66025403784437 175.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M403 180L411.66025403784437 185.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><text x="280" y="161" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#5ce2d1">p = m·v</text><text x="315" y="320" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="660" fill="#a9bac6">Suma pędów zależy od zwrotów.</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">m = 0,5 kg</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">v = 8 m/s</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">p = m·v</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">p = 4 kg·m/s</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>