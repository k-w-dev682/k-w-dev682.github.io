<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">Przyspieszenie: zmiana prędkości na sekundę</title><desc id="d">**a to zmiana v na zmianę t**, nie zmiana drogi.</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">Przyspieszenie: zmiana prędkości na sekundę</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><path d="M110 265L543 265" fill="none" stroke="#a9bac6" stroke-width="2.3" stroke-linecap="round"/><path d="M110 308L110 139" fill="none" stroke="#a9bac6" stroke-width="2.3" stroke-linecap="round"/><text x="539" y="289" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="620" fill="#e9f6fa">czas t</text><text x="116" y="149" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="630" fill="#e9f6fa">v(t)</text><path d="M137 169L480 300" fill="none" stroke="#5ce2d1" stroke-width="4" stroke-linecap="round"/><circle cx="137" cy="169" r="6" fill="#f5be76" stroke="#061019" stroke-width="2"/><circle cx="480" cy="300" r="6" fill="#5ce2d1" stroke="#061019" stroke-width="2"/><path d="M480 265L480 300" fill="none" stroke="#8db9ff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 7"/><text x="235" y="163" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" fill="#5ce2d1">a &lt; 0: v(t) maleje</text><text x="175" y="299" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="680" fill="#f5be76">przejście przez v = 0</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">v₀ = 4 m/s</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">vₖ = −2 m/s</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">t = 3 s</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">a = −2 m/s²</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>