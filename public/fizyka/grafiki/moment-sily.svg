t="660" fill="#a9bac6">Zależność od r</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">r = 0,25 m</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">F = 40 N</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">kąt 90°</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">τ = 10 N·m</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>