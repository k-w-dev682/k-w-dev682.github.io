<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">Do środka oznacza zmianę kierunku, nie dodatkowy rodzaj siły</title><desc id="d">**Do środka: v²/r, a siła to m·v²/r.**</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">Do środka oznacza zmianę kierunku, nie dodatkowy rodzaj siły</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><circle cx="323" cy="232" r="98" fill="none" stroke="#486270" stroke-width="3"/><circle cx="323" cy="232" r="7" fill="#f5be76" stroke="#061019" stroke-width="2"/><circle cx="421" cy="232" r="9" fill="#5ce2d1" stroke="#061019" stroke-width="2"/><path d="M420 232L326 232" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M326 232L334.66025403784437 227.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M326 232L334.66025403784437 237.0" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M420 232L420 128" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><path d="M420 128L425.0 136.6602540378444" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><path d="M420 128L415.0 136.6602540378444" fill="none" stroke="#5ce2d1" stroke-width="3" stroke-linecap="round"/><text x="346" y="219" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="770" fill="#f5be76">r</text><text x="427" y="145" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#5ce2d1">v</text><text x="330" y="261" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="680" fill="#e9f6fa">O</text><text x="180" y="333" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#a9bac6">a_d → środek, v → styczna</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">r = 2 m</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">v = 4 m/s</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">a_d = 8 m/s²</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">F_d = 16 N</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>