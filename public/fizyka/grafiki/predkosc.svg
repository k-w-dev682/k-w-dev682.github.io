 stroke="#061019" stroke-width="2"/><path d="M176 205L452 205" fill="none" stroke="#5ce2d1" stroke-width="2.5" stroke-linecap="round"/><path d="M452 205L443.33974596215563 210.0" fill="none" stroke="#5ce2d1" stroke-width="2.5" stroke-linecap="round"/><path d="M452 205L443.33974596215563 200.0" fill="none" stroke="#5ce2d1" stroke-width="2.5" stroke-linecap="round"/><text x="164" y="267" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#f5be76">POCZĄTEK</text><text x="461" y="267" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#5ce2d1">KONIEC</text><text x="317" y="175" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e9f6fa">zmiana położenia</text><text x="317" y="303" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#a9bac6">Na osi liczy się pozycja i zwrot.</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">x₀ = −2 m</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">xₖ = 10 m</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start"