<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">Napięcie nici ciągnie, a nie pcha</title><desc id="d">**Nić tylko ciągnie; T oblicz z ΣF=ma.**</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">Napięcie nici ciągnie, a nie pcha</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><path d="M120 139L510 139" fill="none" stroke="#a9bac6" stroke-width="5" stroke-linecap="round"/><path d="M312 140L312 221" fill="none" stroke="#a9bac6" stroke-width="3" stroke-linecap="round"/><rect x="269" y="222" width="86" height="65" rx="10" fill="#0b151f" stroke="#5ce2d1" stroke-width="1.4"/><text x="312" y="262" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="810" fill="#e9f6fa">m</text><path d="M312 220L312 158" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M312 158L317.0 166.6602540378444" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M312 158L307.0 166.6602540378444" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M312 287L312 337" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M312 337L307.0 328.33974596215563" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M312 337L317.0 328.33974596215563" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><text x="331" y="175" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#8db9ff">T</text><text x="330" y="325" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5be76">mg</text><text x="151" y="184" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="680" fill="#a9bac6">nić ciągnie do góry</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">m = 2 kg</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">g ≈ 10 m/s²</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">T = 20 N</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">mg = 20 N</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>