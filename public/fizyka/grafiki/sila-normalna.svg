<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d"><title id="t">Siła normalna jest prostopadła do powierzchni</title><desc id="d">**N jest prostopadła do podłoża. Jej wartość licz z równania osi prostopadłej.**</desc><rect x="2" y="2" width="956" height="384" rx="22" fill="#06090e" stroke="#33505e" stroke-width="1.4"/><text x="32" y="30" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="820" fill="#5ce2d1">STUDYLAB  /  FIZYKA  /  BLACK EDITION</text><text x="32" y="63" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="760" fill="#e9f6fa">Siła normalna jest prostopadła do powierzchni</text><rect x="32" y="116" width="575" height="239" rx="16" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><path d="M82 290L535 290" fill="none" stroke="#a9bac6" stroke-width="3" stroke-linecap="round"/><rect x="256" y="222" width="106" height="64" rx="10" fill="#0b151f" stroke="#5ce2d1" stroke-width="1.4"/><text x="309" y="261" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="810" fill="#e9f6fa">m</text><path d="M309 222L309 157" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M309 157L314.0 165.6602540378444" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M309 157L304.0 165.6602540378444" fill="none" stroke="#8db9ff" stroke-width="3" stroke-linecap="round"/><path d="M309 287L309 338" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M309 338L304.0 329.33974596215563" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><path d="M309 338L314.0 329.33974596215563" fill="none" stroke="#f5be76" stroke-width="3" stroke-linecap="round"/><text x="325" y="160" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#8db9ff">N</text><text x="330" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#f5be76">mg</text><text x="161" y="187" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#a9bac6">prostopadle do podłoża</text><rect x="624" y="116" width="305" height="239" rx="16" fill="#0b151f" stroke="#33505e" stroke-width="1.4"/><text x="644" y="151" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#5ce2d1">ODCZYTAJ DANE I WYNIK</text><rect x="642" y="173" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="196" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">m = 3 kg</text><rect x="642" y="218" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="241" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">g ≈ 10 m/s²</text><rect x="642" y="263" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="286" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#e9f6fa">mg = 30 N</text><rect x="642" y="308" width="270" height="36" rx="8" fill="#10212c" stroke="#33505e" stroke-width="1.4"/><text x="656" y="331" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="710" fill="#f5be76">N = 30 N</text><text x="34" y="375" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bac6">Uproszczony schemat edukacyjny — nie zawsze w skali. Obliczenia i założenia są w tekście lekcji.</text></svg>